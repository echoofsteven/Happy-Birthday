<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Sayang! 💜</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #e6d5f7 0%, #c8b6ff 50%, #b8c0ff 100%);
      color: #4a3b52;
      text-align: center;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }

    /* Efek Partikel Jatuh */
    .falling-item {
      position: fixed;
      pointer-events: none;
      z-index: 1;
      animation: fall linear infinite;
    }
    
    @keyframes fall {
      0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
      100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
    }

    .container {
      width: 100%;
      max-width: 420px;
      position: relative;
      z-index: 10;
      margin-top: 30px;
    }

    /* Frame Kartu Utama */
    .card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 40px 20px 30px 20px;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(106, 76, 147, 0.2);
      border: 3px solid #e7c6ff;
      position: relative;
      overflow: visible;
    }

    /* Panda Nangkring di Atas Card */
    .panda-top {
      position: absolute;
      top: -42px;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      z-index: 25;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.15));
    }

    /* Tombol Musik Pojok Kanan Atas */
    .music-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      background: #9d4edd;
      color: white;
      border: none;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.1rem;
      box-shadow: 0 4px 10px rgba(157, 78, 221, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 30;
      transition: all 0.3s ease;
    }
    .music-btn:hover { transform: scale(1.1); }

    h1 { color: #7b2cbf; margin-bottom: 10px; font-size: 1.6rem; margin-top: 10px; }
    .subtitle { font-size: 0.95rem; color: #9d4edd; margin-bottom: 25px; line-height: 1.5; }

    /* Tombol Utama */
    .btn-action {
      background: #9d4edd;
      color: white;
      border: none;
      padding: 12px 30px;
      font-size: 1rem;
      border-radius: 50px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 5px 15px rgba(157, 78, 221, 0.4);
      transition: all 0.3s ease;
    }
    .btn-action:hover { background: #7b2cbf; transform: scale(1.05); }

    /* Video Fullscreen Overlay */
    .video-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.92);
      z-index: 100;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .video-overlay video {
      width: 85%;
      max-width: 320px;
      aspect-ratio: 9/16;
      border-radius: 16px;
      box-shadow: 0 0 20px rgba(255,255,255,0.2);
    }
    .btn-close-video {
      margin-top: 18px;
      background: #9d4edd;
      color: white;
      border: none;
      padding: 10px 22px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.9rem;
    }

    /* Stiker Beruang di Pojok Bawah */
    .sticker-bears {
      position: absolute;
      bottom: -22px;
      left: -15px;
      width: 75px;
      z-index: 25;
    }

    /* Layout Zig-Zag Foto & Teks */
    .zigzag-item {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
      text-align: left;
    }
    .zigzag-item.reverse { flex-direction: row-reverse; text-align: right; }
    
    .zigzag-img {
      width: 115px;
      height: 115px;
      object-fit: cover;
      border-radius: 16px;
      border: 2px solid #e7c6ff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      flex-shrink: 0;
    }
    .zigzag-text {
      font-size: 0.88rem;
      color: #4a3b52;
      line-height: 1.4;
      font-weight: 500;
    }

    /* Kotak Surat Utama */
    .wishes {
      line-height: 1.7;
      font-size: 0.92rem;
      color: #3c096c;
      background: #fcf8ff;
      padding: 16px;
      border-radius: 16px;
      border-left: 4px solid #9d4edd;
      text-align: left;
      margin-top: 15px;
      white-space: pre-line;
      box-shadow: 0 4px 12px rgba(157, 78, 221, 0.08);
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- Audio Backsound -->
  <audio id="bgMusic" loop src="lagu.mp3"></audio>

  <!-- Container Efek Partikel -->
  <div id="effectContainer"></div>

  <!-- Overlay Video 9:16 -->
  <div class="video-overlay" id="videoOverlay">
    <video controls id="mainVideo">
      <source src="video1.mp4" type="video/mp4">
    </video>
    <button class="btn-close-video" onclick="finishVideo()">Lanjut Lihat Surat & Foto 💜</button>
  </div>

  <div class="container">
    
    <!-- TAHAP 1: LANDING PAGE -->
    <div class="card" id="tahap1">
      <img src="https://raw.githubusercontent.com/Tarikul-Islam-Anik/Animated-Fluent-Emojis/master/Emojis/Animals/Panda.png" class="panda-top" alt="Panda">
