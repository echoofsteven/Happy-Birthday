<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Sayang! 💜</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #e6d5f7 0%, #c8b6ff 50%, #b8c0ff 100%);
      color: #4a3b52;
      text-align: center;
      padding: 40px 15px;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Element Jatuh Melayang */
    .falling-item {
      position: fixed;
      pointer-events: none;
      z-index: 1;
      animation: fall linear infinite;
    }
    
    @keyframes fall {
      0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
      100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
    }

    .container {
      max-width: 450px;
      margin: 40px auto 0 auto;
      position: relative;
      z-index: 10;
    }

    /* Frame Utama Lilac */
    .card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      padding: 45px 25px 30px 25px;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(106, 76, 147, 0.18);
      border: 3px solid #e7c6ff;
      position: relative;
      overflow: visible !important; /* PENTING: Supaya panda gak kepotong frame */
    }

    /* Panda Nangkring Pas di Garis Atas Frame */
    .panda-top {
      position: absolute;
      top: -35px; /* Diturunkan biar badannya nangkring di garis frame */
      left: 50%;
      transform: translateX(-50%);
      width: 75px;
      z-index: 25;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.15));
    }

    /* Tombol Musik di Pojok Kanan Atas Frame Tahap 2 */
    .music-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      background: #9d4edd;
      color: white;
      border: none;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.1rem;
      box-shadow: 0 4px 10px rgba(157, 78, 221, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 30;
      transition: all 0.3s ease;
    }
    .music-btn:hover { transform: scale(1.1); }

    h1 { color: #7b2cbf; margin-bottom: 12px; font-size: 1.6rem; margin-top: 10px; }
    .subtitle { font-size: 0.95rem; color: #9d4edd; margin-bottom: 25px; line-height: 1.5; }

    /* Tombol Buka Surat Utama */
    .btn-action {
      display: inline-block;
      background: #9d4edd;
      color: white;
      border: none;
      padding: 14px 32px;
      font-size: 1.05rem;
      border-radius: 50px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 5px 15px rgba(157, 78, 221, 0.4);
      transition: all 0.3s ease;
    }
    .btn-action:hover { background: #7b2cbf; transform: scale(1.05); }

    /* Overlay Video 9:16 Fullscreen */
    .video-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.9);
      z-index: 100;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .video-overlay video {
      width: 90%;
      max-width: 330px;
      aspect-ratio: 9/16;
      border-radius: 16px;
      box-shadow: 0 0 20px rgba(255,255,255,0.2);
    }
    .btn-close-video {
      margin-top: 18px;
      background: #9d4edd;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.95rem;
    }

    /* Stiker Animasi Tambahan */
    .sticker-bears {
      position: absolute;
      bottom: -25px;
      left: -15px;
      width: 75px;
      z-index: 25;
    }

    /* Layout Zig-Zag Foto & Teks */
    .zigzag-item {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 22px;
      text-align: left;
    }
    .zigzag-item.reverse { flex-direction: row-reverse; text-align: right; }
    
    .zigzag-img {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 16px;
      border: 2px solid #e7c6ff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      flex-shrink: 0;
    }
    .zigzag-text {
      font-size: 0.9rem;
      color: #4a3b52;
      line-height: 1.4;
      font-weight: 500;
    }

    /* Surat Utama di Paling Bawah */
    .wishes {
      line-height: 1.7;
      font-size: 0.95rem;
      color: #3c096c;
      background: #fcf8ff;
      padding: 18px;
      border-radius: 16px;
      border-left: 4px solid #9d4edd;
      text-align: left;
      margin-top: 15px;
      white-space: pre-line;
      box-shadow: 0 4px 12px rgba(157, 78, 221, 0.08);
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="video-overlay" id="videoOverlay">
    <video controls id="mainVideo">
      <source src="video1.mp4" type="video/mp4">
    </video>
    <button class="btn-close-video" onclick="finishVideo()">Lanjut Lihat Surat & Foto 💜</button>
  </div>

    <div class="card" id="tahap1">

      <img src="https://raw.githubusercontent.com/Tarikul-Islam-Anik/Animated-Fluent-Emojis/master/Emojis/Animals/Panda.png" class="panda-top" alt="Panda">
      
      <h1>Happy Birthday Sayang! 💜</h1>

    </div>

      <button class="music-btn" id="musicToggle" onclick="toggleMusic()">🎵</button>
