<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Sayang! 💜</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #e6d5f7 0%, #c8b6ff 50%, #b8c0ff 100%);
      color: #4a3b52;
      text-align: center;
      min-height: 100vh;
      padding: 60px 15px 30px 15px;
      overflow-x: hidden;
      position: relative;
    }

    /* Partikel Jatuh */
    .falling-item {
      position: fixed;
      pointer-events: none;
      z-index: 1;
      animation: fall linear infinite;
    }
    
    @keyframes fall {
      0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
      100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
    }

    .container {
      max-width: 440px;
      margin: 0 auto;
      position: relative;
      z-index: 10;
    }

    /* Frame Kartu Utama */
    .card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 45px 25px 35px 25px;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(106, 76, 147, 0.2);
      border: 3px solid #e7c6ff;
      position: relative;
      overflow: visible !important;
      min-height: 240px; /* Bikin kartu nggak bakal gepeng lagi */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Panda Nangkring Pas di Garis Atas */
    .panda-top {
      position: absolute;
      top: -38px;
      left: 50%;
      transform: translateX(-50%);
      width: 75px;
      z-index: 25;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.15));
    }

    /* Tombol Musik Tahap 2 */
    .music-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      background: #9d4edd;
      color: white;
      border: none;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.1rem;
      box-shadow: 0 4px 10px rgba(157, 78, 221, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 30;
    }

    h1 { color: #7b2cbf; margin-bottom: 12px; font-size: 1.6rem; margin-top: 10px; }
    .subtitle { font-size: 0.95rem; color: #9d4edd; margin-bottom: 25px; line-height: 1.5; }

    /* Tombol Buka Surat */
    .btn-action {
      background: #9d4edd;
      color: white;
      border: none;
      padding: 14px 32px;
      font-size: 1rem;
      border-radius: 50px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 5px 15px rgba(157, 78, 221, 0.4);
      transition: all 0.3s ease;
      display: inline-block;
    }
    .btn-action:hover { background: #7b2cbf; transform: scale(1.05); }

    /* Overlay Video Fullscreen */
    .video-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0
    }
