<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Sayang! 💜</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #e6d5f7 0%, #c8b6ff 50%, #b8c0ff 100%);
      color: #4a3b52;
      text-align: center;
      min-height: 100vh;
      padding: 60px 15px 40px 15px;
      overflow-x: hidden;
      position: relative;
    }

    /* Partikel Jatuh */
    .falling-item {
      position: fixed;
      pointer-events: none;
      z-index: 1;
      animation: fall linear infinite;
    }
    
    @keyframes fall {
      0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
      100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
    }

    .container {
      max-width: 440px;
      margin: 0 auto;
      position: relative;
      z-index: 10;
    }

    /* Frame Kartu Utama */
    .card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 45px 25px 50px 25px; /* Jarak bawah ditambah biar gak numpuk sama tombol pojok */
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(106, 76, 147, 0.2);
      border: 3px solid #e7c6ff;
      position: relative;
      overflow: visible !important;
      min-height: 260px;
    }

    /* Panda Nangkring Pas di Garis Atas */
    .panda-top {
      position: absolute;
      top: -38px;
      left: 50%;
      transform: translateX(-50%);
      width: 75px;
      z-index: 25;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.15));
    }

    /* Tombol Musik Pojok Kanan Atas */
    .music-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      background: #9d4edd;
      color: white;
      border: none;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.1rem;
      box-shadow: 0 4px 10px rgba(157, 78, 221, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 30;
    }
